name: ci
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10.34.9'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build
      - name: verify bin shebangs preserved
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node' || { echo "stdio bin missing shebang"; exit 1; }
          head -1 dist/http/index.js | grep -q '^#!/usr/bin/env node' || { echo "http bin missing shebang"; exit 1; }
      - name: verify pack succeeds
        run: pnpm pack --pack-destination /tmp
